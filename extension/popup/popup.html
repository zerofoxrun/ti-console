<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>TI Console</title>
<!--
  ОКНО ПО КЛИКУ НА ЗНАЧОК TI.
  Одно значение — сразу тип, пометки и подходящие сервисы, без открытия
  вкладки. Раньше по этому клику страница разбиралась сразу; теперь разбор
  страницы — кнопка здесь же. Один лишний клик за то, что у значка
  перестало быть одно необъявленное действие: попап показывает, что
  вообще можно сделать, а не делает это молча.
-->
<link rel="stylesheet" href="../newtab/newtab.css">
<style>
  body { width: 380px; font-size: 13px; }
  .pop { padding: 10px 12px 12px; }
  .pop h1 { margin: 0 0 8px; font: 600 13px var(--sans); display: flex; align-items: center; gap: 7px; }
  .pop .tlp-mini { margin-left: auto; font: 11px var(--sans); color: var(--fg-muted); }
  .pop textarea { width: 100%; height: 56px; resize: vertical; }
  .pop .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .pop .res { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 9px; }
  .pop .res-val { font: 12px var(--mono); word-break: break-all; }
  .pop .res-type { font: 600 11px var(--sans); color: var(--fg-muted); text-transform: uppercase;
                   letter-spacing: .04em; }
  .pop .empty { font: 11.5px var(--sans); color: var(--fg-faint); line-height: 1.5; margin: 8px 0 0; }
  .pop .more { font: 11px var(--sans); color: var(--fg-faint); margin: 7px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="pop">
  <h1>
    <span class="brand-mark">TI</span> Console
    <span class="tlp-mini" id="p-mode">режим: —</span>
  </h1>

  <textarea id="q" spellcheck="false"
            placeholder="Вставьте одно значение: адрес, домен, URL, хеш, CVE…&#10;Дефанг hxxp:// и [.] понимается"></textarea>

  <div class="row">
    <button class="btn btn-mini btn-primary" id="go">Разобрать</button>
    <button class="btn btn-mini" id="scan">Разобрать эту страницу</button>
    <button class="btn btn-mini btn-ghost" id="open">Открыть консоль</button>
  </div>

  <div class="res" id="res" hidden></div>
  <p class="empty" id="hint">
    Разбор идёт на этой машине. Сервис откроется только по клику —
    сам попап никуда ничего не отправляет.
  </p>
</div>

<script src="../lib/compat.js"></script>
<script src="../lib/ioc.js"></script>
<script src="popup.js"></script>
</body>
</html>
